{#
    Shared favicon/app-icon <head> tags - included by both the public
    layout and the admin layout so there's exactly one place that lists
    every icon size, all generated from the same source logo
    (see app/static/img/brand/logo-master.png).
#}
{% macro render_favicon_links() %}
<link rel="icon" href="/static/img/brand/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/brand/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/brand/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/static/img/brand/favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/brand/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/img/brand/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/img/brand/android-chrome-512x512.png">
<link rel="manifest" href="/static/img/brand/site.webmanifest">
<meta name="theme-color" content="#2563eb">
{% endmacro %}
