{% extends "admin/_layout.html" %}
{% from "components/icons.html" import icon %}

{% block title %}Admin Login - LearnIn{% endblock %}

{% block guest_content %}
<div class="admin-auth-wrapper admin-auth-wrapper--split">
    <form method="post" action="/admin/login" class="admin-auth-form">
        <img class="admin-auth-logo" src="/static/img/brand/logo-mark.webp?v=2" alt="" width="44" height="44">
        <h1>LearnIn Admin</h1>

        {% if error %}
        <p class="admin-error">{{ error }}</p>
        {% endif %}

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>

        <label for="password">Password</label>
        <div class="password-input-wrapper">
            <input type="password" id="password" name="password" required>
            <button type="button" class="password-toggle" data-password-toggle aria-pressed="false" aria-label="Show password">
                <span class="password-toggle-icon password-toggle-icon--show">{{ icon('eye', 18) }}</span>
                <span class="password-toggle-icon password-toggle-icon--hide">{{ icon('eye-off', 18) }}</span>
            </button>
        </div>

        <button type="submit">Sign in</button>
    </form>
    <div class="admin-auth-illustration">
        <img src="/static/img/illustrations/login.webp" alt="" aria-hidden="true">
    </div>
</div>
{% endblock %}
