<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-hidden="true">
  <!-- Original LearnIn scene: a global search card with grouped results -
       used for the search page and generic empty states site-wide. -->
  <defs>
    <filter id="es-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <circle cx="210" cy="170" r="160" fill="#EFF4FF"/>
  <ellipse cx="210" cy="320" rx="130" ry="14" fill="#1E3A5F" opacity="0.14" filter="url(#es-shadow)"/>

  <g transform="translate(105,60)">
    <rect width="210" height="240" rx="18" fill="#FFFFFF" stroke="#EAEAEA"/>

    <!-- search input -->
    <rect x="18" y="18" width="174" height="34" rx="10" fill="#F3F6FC" stroke="#EAEAEA"/>
    <circle cx="36" cy="35" r="8" fill="none" stroke="#93c5fd" stroke-width="2.4"/>
    <path d="M42 41l6 6" stroke="#93c5fd" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="56" y="31" width="90" height="8" rx="4" fill="#dbe6fb"/>

    <!-- group: exams -->
    <rect x="18" y="66" width="60" height="9" rx="4.5" fill="#1E3A5F" opacity="0.7"/>
    <g>
      <rect x="18" y="82" width="20" height="20" rx="6" fill="#EFF4FF"/>
      <path d="M23 96l4-14 4 14z" fill="#2563eb"/>
      <rect x="46" y="88" width="120" height="9" rx="4.5" fill="#F3F6FC"/>
      <rect x="18" y="110" width="20" height="20" rx="6" fill="#EFF4FF"/>
      <path d="M23 124l4-14 4 14z" fill="#93c5fd"/>
      <rect x="46" y="116" width="90" height="9" rx="4.5" fill="#F3F6FC"/>
    </g>

    <!-- group: subjects -->
    <rect x="18" y="146" width="70" height="9" rx="4.5" fill="#1E3A5F" opacity="0.7"/>
    <g>
      <rect x="18" y="162" width="20" height="20" rx="6" fill="#EFF4FF"/>
      <rect x="24" y="168" width="8" height="8" rx="2" fill="#2563eb"/>
      <rect x="46" y="168" width="130" height="9" rx="4.5" fill="#F3F6FC"/>
    </g>

    <!-- group: blogs -->
    <rect x="18" y="196" width="50" height="9" rx="4.5" fill="#1E3A5F" opacity="0.7"/>
    <g>
      <rect x="18" y="212" width="20" height="20" rx="6" fill="#EFF4FF"/>
      <path d="M22 218a6 6 0 0 1 12 0v4h-12z" fill="#93c5fd"/>
      <rect x="46" y="218" width="100" height="9" rx="4.5" fill="#F3F6FC"/>
    </g>
  </g>
</svg>
