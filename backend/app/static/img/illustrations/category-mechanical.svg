<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-hidden="true">
  <!-- Original LearnIn scene: an interlocking gear pair with a wrench, for
       Mechanical Engineering departments/subjects. -->
  <defs>
    <filter id="me-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <circle cx="210" cy="170" r="160" fill="#EFF4FF"/>
  <ellipse cx="210" cy="300" rx="140" ry="14" fill="#1E3A5F" opacity="0.14" filter="url(#me-shadow)"/>

  <!-- large gear -->
  <g transform="translate(200,170)">
    <g fill="#1E3A5F">
      <rect x="-10" y="-92" width="20" height="26" rx="4"/>
      <rect x="-10" y="66" width="20" height="26" rx="4"/>
      <rect x="-92" y="-10" width="26" height="20" rx="4"/>
      <rect x="66" y="-10" width="26" height="20" rx="4"/>
      <rect x="-10" y="-92" width="20" height="26" rx="4" transform="rotate(45)"/>
      <rect x="-10" y="66" width="20" height="26" rx="4" transform="rotate(45)"/>
      <rect x="-92" y="-10" width="26" height="20" rx="4" transform="rotate(45)"/>
      <rect x="66" y="-10" width="26" height="20" rx="4" transform="rotate(45)"/>
    </g>
    <circle r="66" fill="#2563eb"/>
    <circle r="26" fill="#EFF4FF"/>
  </g>

  <!-- small gear -->
  <g transform="translate(310,240)">
    <g fill="#1d4ed8">
      <rect x="-7" y="-56" width="14" height="18" rx="3"/>
      <rect x="-7" y="38" width="14" height="18" rx="3"/>
      <rect x="-56" y="-7" width="18" height="14" rx="3"/>
      <rect x="38" y="-7" width="18" height="14" rx="3"/>
      <rect x="-7" y="-56" width="14" height="18" rx="3" transform="rotate(45)"/>
      <rect x="-7" y="38" width="14" height="18" rx="3" transform="rotate(45)"/>
      <rect x="-56" y="-7" width="18" height="14" rx="3" transform="rotate(45)"/>
      <rect x="38" y="-7" width="18" height="14" rx="3" transform="rotate(45)"/>
    </g>
    <circle r="40" fill="#93c5fd"/>
    <circle r="16" fill="#FFFFFF"/>
  </g>

  <!-- wrench chip -->
  <g transform="translate(96,250)">
    <circle r="34" fill="#FFFFFF" stroke="#EAEAEA"/>
    <path d="M-14-14a10 10 0 1 0 14 14l16 16 6-6-16-16a10 10 0 0 0-20-8z" fill="#1E3A5F"/>
  </g>
</svg>
