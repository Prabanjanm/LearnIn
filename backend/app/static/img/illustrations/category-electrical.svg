<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-hidden="true">
  <!-- Original LearnIn scene: a circuit-board trace with a lightning bolt,
       for Electrical/Electronics departments/subjects. -->
  <defs>
    <filter id="ee-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <circle cx="210" cy="170" r="160" fill="#EFF4FF"/>
  <ellipse cx="210" cy="300" rx="140" ry="14" fill="#1E3A5F" opacity="0.14" filter="url(#ee-shadow)"/>

  <!-- circuit board card -->
  <rect x="80" y="86" width="240" height="176" rx="18" fill="#1E3A5F"/>

  <!-- traces -->
  <path d="M110 130h60v40h50v-40h60M110 230h50v-40h60v40h60" fill="none" stroke="#2f5688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="110" cy="130" r="6" fill="#93c5fd"/>
  <circle cx="310" cy="130" r="6" fill="#93c5fd"/>
  <circle cx="110" cy="230" r="6" fill="#93c5fd"/>
  <circle cx="310" cy="230" r="6" fill="#93c5fd"/>
  <circle cx="170" cy="170" r="6" fill="#93c5fd"/>
  <circle cx="250" cy="170" r="6" fill="#93c5fd"/>

  <!-- lightning bolt -->
  <path d="M222 108l-46 68h34l-10 76 56-84h-32z" fill="#FFC107"/>

  <!-- resistor chip -->
  <g transform="translate(210,296)">
    <rect x="-56" y="-16" width="112" height="32" rx="16" fill="#FFFFFF" stroke="#EAEAEA"/>
    <path d="M-34 0h8l6-14 10 28 10-28 6 14h8" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
