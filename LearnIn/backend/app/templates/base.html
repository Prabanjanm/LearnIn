<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LearnIn{% endblock %}</title>

    <meta name="description"
          content="{% block description %}LearnIn - Previous Year Question Papers, Mock Tests and Study Materials{% endblock %}">

    <link rel="stylesheet"
          href="/static/css/base.css">

    {% block css %}{% endblock %}

</head>

<body>

<header>

    <div class="container">

        <a href="/" class="logo">
            LearnIn
        </a>

        <nav>

            <a href="/">Home</a>

            <a href="/blogs">Blogs</a>

        </nav>

    </div>

</header>


<main>

    {% block content %}

    {% endblock %}

</main>


<footer>

    <div class="container">

        © 2026 LearnIn

    </div>

</footer>

<script src="/static/js/app.js"></script>

{% block js %}{% endblock %}

</body>
</html>
